name: (Dev) BTP Download to GIT and Upload/Deploy to TST

on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID"
        required: true
        type: string
      mode:
        description: "Mode IntegrationPackages/PartnerDirectory"
        required: true
        type: choice
        options:
          - IntegrationPackages
          - PartnerDirectory
      commit-message:
        description: "JIRA Story / SNOW Incident"
        required: true
        type: string

permissions:
  contents: write

jobs:
  initialize-dev:
    name: Read Environment Variables for DEV
    runs-on: ${{ vars.RUNS_ON && fromJson(vars.RUNS_ON) || 'ubuntu-latest' }}
    environment: DEV
    outputs:
      btp-api-user: ${{ steps.export.outputs.btp-api-user }}
      btp-tec-user: ${{ steps.export.outputs.btp-tec-user }}
      btp-token-url: ${{ steps.export.outputs.btp-token-url }}
      btp-api-url: ${{ steps.export.outputs.btp-api-url }}
      git-cicd-orgrepo: ${{ steps.export.outputs.git-cicd-orgrepo }}
      git-cicd-ref: ${{ steps.export.outputs.git-cicd-ref }}
      git-target-branch: ${{ steps.export.outputs.git-target-branch }}
    steps:
      - name: Export vars
        id: export
        run: |
          echo "btp-api-user=${{ vars.BTP_API_USER }}" >> $GITHUB_OUTPUT
          echo "btp-tec-user=${{ vars.BTP_TEC_USER }}" >> $GITHUB_OUTPUT
          echo "btp-token-url=${{ vars.BTP_TOKEN_URL }}" >> $GITHUB_OUTPUT
          echo "btp-api-url=${{ vars.BTP_API_URL }}" >> $GITHUB_OUTPUT
          echo "git-cicd-orgrepo=${{ vars.GIT_CICD_ORGREPO }}" >> $GITHUB_OUTPUT
          echo "git-cicd-ref=${{ vars.GIT_CICD_REF }}" >> $GITHUB_OUTPUT
          echo "git-target-branch=${{ vars.GIT_TARGET_BRANCH || 'main' }}" >> $GITHUB_OUTPUT

  btp-download-btp:
    needs: [initialize-dev]
    name: Download ${{ inputs.mode }} from DEV
    uses: SAP/cicd-actions-for-sap-integration-suite/.github/workflows/download-btp-to-git.yml@v1.3.0
    with:
       workflow-ref: ${{ needs.initialize-dev.outputs.git-cicd-ref }}
       source-env: DEV
       target-ref: ${{ needs.initialize-dev.outputs.git-target-branch }}
       ids: ${{ inputs.id }}
       mode: ${{ inputs.mode }}
       commit-message: ${{ inputs.commit-message }}
       btp-api-user: ${{ needs.initialize-dev.outputs.btp-api-user }}
       btp-tec-user: ${{ needs.initialize-dev.outputs.btp-tec-user }}
       btp-token-url: ${{ needs.initialize-dev.outputs.btp-token-url }}
       btp-api-url: ${{ needs.initialize-dev.outputs.btp-api-url }}
       git-cicd-orgrepo: ${{ needs.initialize-dev.outputs.git-cicd-orgrepo }}
    secrets:
       BTP_API_PASSWORD: ${{ secrets.BTP_API_PASSWORD }}
       BTP_TEC_PASSWORD: ${{ secrets.BTP_TEC_PASSWORD }}
       GIT_CICD_TOKEN: ${{ secrets.GIT_CICD_TOKEN }}

  initialize-tst:
    needs: [btp-download-btp]
    name: Read Environment Variables for TST
    runs-on: ${{ vars.RUNS_ON && fromJson(vars.RUNS_ON) || 'ubuntu-latest' }}
    environment: TST
    outputs:
      btp-api-user: ${{ steps.export.outputs.btp-api-user }}
      btp-tec-user: ${{ steps.export.outputs.btp-tec-user }}
      btp-token-url: ${{ steps.export.outputs.btp-token-url }}
      btp-api-url: ${{ steps.export.outputs.btp-api-url }}
      git-cicd-orgrepo: ${{ steps.export.outputs.git-cicd-orgrepo }}
      git-cicd-ref: ${{ steps.export.outputs.git-cicd-ref }}
      git-target-branch: ${{ steps.export.outputs.git-target-branch }}
    steps:
      - name: Export vars
        id: export
        run: |
          echo "btp-api-user=${{ vars.BTP_API_USER }}" >> $GITHUB_OUTPUT
          echo "btp-tec-user=${{ vars.BTP_TEC_USER }}" >> $GITHUB_OUTPUT
          echo "btp-token-url=${{ vars.BTP_TOKEN_URL }}" >> $GITHUB_OUTPUT
          echo "btp-api-url=${{ vars.BTP_API_URL }}" >> $GITHUB_OUTPUT
          echo "git-cicd-orgrepo=${{ vars.GIT_CICD_ORGREPO }}" >> $GITHUB_OUTPUT
          echo "git-cicd-ref=${{ vars.GIT_CICD_REF }}" >> $GITHUB_OUTPUT
          echo "git-target-branch=${{ vars.GIT_TARGET_BRANCH || 'main' }}" >> $GITHUB_OUTPUT

  btp-upload-deploy-tst:
    needs: [initialize-tst]
    name: Upload/Deploy ${{ inputs.mode }} to TST
    uses: SAP/cicd-actions-for-sap-integration-suite/.github/workflows/delete-upload.yml@v1.3.0
    with:
      workflow-ref: ${{ needs.initialize-tst.outputs.git-cicd-ref }}
      target-env: TST
      source-ref: ${{ needs.initialize-tst.outputs.git-target-branch }}
      integrationpackages-upload-ids: ${{ inputs.mode == 'IntegrationPackages' && inputs.id || '' }}
      partnerdirectory-upload-ids: ${{ inputs.mode == 'PartnerDirectory' && inputs.id || '' }}
      btp-api-user: ${{ needs.initialize-tst.outputs.btp-api-user }}
      btp-tec-user: ${{ needs.initialize-tst.outputs.btp-tec-user }}
      btp-token-url: ${{ needs.initialize-tst.outputs.btp-token-url }}
      btp-api-url: ${{ needs.initialize-tst.outputs.btp-api-url }}
      git-cicd-orgrepo: ${{ needs.initialize-tst.outputs.git-cicd-orgrepo }}
    secrets:
      BTP_TEC_PASSWORD: ${{ secrets.BTP_TEC_PASSWORD }}
      BTP_API_PASSWORD: ${{ secrets.BTP_API_PASSWORD }}
      GIT_CICD_TOKEN: ${{ secrets.GIT_CICD_TOKEN }}
